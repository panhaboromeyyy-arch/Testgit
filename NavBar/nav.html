<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav exercise</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav {
            width: 100%;
            height: 80px;
            display: flex;
            box-shadow: rgba(0, 0, 0, 0.2) 0px 5px 15px;
            background-color: rgb(249, 225, 229);
        }
        .logo {
            width: 30%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo img {
            width: 130px;
        }
        .option {
            width: 70%;
            height: 100%;
            display: flex;
        }
        .home, .about, .skill {
            width: 25%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;         
            font-size: 22px;
            cursor: pointer;
        }
        .material-symbols-outlined {
            font-size: 1.2em;
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }
        .skill img {
            height: 1.1em;
            width: auto;
        }
        .login {
            width: 25%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login button {
            padding: 10px 24px;
            background-color: #f7a8b8;
            font-size: 20px;
            border-radius: 8px;
            box-shadow: rgba(0, 0, 0, 0.15) 0px 4px 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
   <nav>
    <div class="logo">
        <img src="../NavBar/PBMlogo.PNG" alt="pbmlogo">
    </div>
    <div class="option">
        <div class="home">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </div>
        <div class="about">
            <span class="material-symbols-outlined">info</span>
            <span>About</span>
        </div>
        <div class="skill">
            <img src="../NavBar/skill.png" alt="Skill">
            <span>Skill</span>
        </div>
        <div class="login">
            <button>Login</button>
        </div>
    </div>
   </nav>
</body>
</html>

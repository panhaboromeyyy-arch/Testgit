<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box {
        width: 105px;
        height: 105px;
        background-color: brown;
    }   
    button:active {
        background-color: darkgreen;
    }
    h1 {
        text-align: center;
    }
    input:focus {
        background-color: darkorchid;
    }
</style>
<body>
    <div class="box"><h1>Hello</h1></div><br><br>
    <button>Click to change</button><br>
    <input type="text" placeholder="test focus">
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent :first-child {
        color: aquamarine;
    }
    .parent :last-child {
        color: blue;
    }
    .parent :nth-child(3) {
        color: blueviolet;
    }
    .parent :nth-child(2) {
        color: brown;
    }
    .parent :nth-child(4) {
        color: fuchsia;
    }
    .parent :nth-child(5) {
        color: dodgerblue;
    }
    .parent :nth-child(6) {
        color: saddlebrown ;
    }
</style>
<body>
    <div class="parent">
        <div>Child1</div>
        <div>Child2</div>
        <div>Child3</div>
        <div>Child4</div>
        <div>Child5</div>
        <div>Child6</div>
        <div>Child7</div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .product-control{
      width: 400px;
      height: 600px;
      margin: 50px auto;
      box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
      border-radius: 10px;
      padding: 15px;
    }
    .image{
      width: 100%;
      height: 85%;
    }
    .image img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
    }
    .des{
      width: 100%;
      height: 30%;
    }
    .btn{
      width: 100%;
      height: 30px;
      margin-top: 10px;
      border-style: none;
      background-color: rgb(247, 48, 51);
      border-radius: 5px;
      color: white;
      box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
    }
  </style>
<body>
  <div class="product-control">
    <div class="image">
      <img src="pd.JPEG" alt="Product Image">
    </div>
    <div class="des">
      <h3>🔥 Strawberry Juice </h3>
      <h4>$2</h4>
      <button class="btn">Add Card</button>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Form</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
   .form-control {
        width: 100%;
        height: 100vh;
        background-image: url("background.PNG");
        background-position: center;
        background-size: cover;
        padding: 40px;
    }
   .form { 
        width: 400px;
        height: 500px;
        border-radius: 10px;
        margin: 50px auto;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(3px);
        padding: 20px;
    }
    .form h3 {
        text-align: center;
        color: rgb(185, 30, 185);
        font-size: 30px;
        @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&family=Moul&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        font-family: times new roman;
    }
    .form label {
        font-size: 26px;
        color: rgb(45, 11, 39);
    }
    .form input {
        width: 100%;
        height: 30px;
        border-style: none;
        border-radius: 5px;
        outline-color: rgb(255, 0, 255);
        padding: 10px;`
        box-shadow: rgba(17, 17, 26, 0.1) 0px 8px 24px, rgba(17, 17, 26, 0.1) 0px 16px 56px, rgba(17, 17, 26, 0.1) 0px 24px 80px;
    }
    .form select {
        width: 100%;
        height: 50px;
        border-style: none;
        border-radius: 5px;
        outline-color: rgb(240, 85, 240);
        padding: 10px;
        box-shadow: rgba(17, 17, 26, 0.1) 0px 8px 24px, rgba(17, 17, 26, 0.1) 0px 16px 56px, rgba(17, 17, 26, 0.1) 0px 24px 80px;
    }
    .btn {
        width: 100%;
        height: 40px;
        margin-top: 40px;
        border-style: none;
        border-radius: 5px;
        background-color: violet;
        color: rgb(248, 214, 248);
        font-size: 20px;
        font-family: times new roman;
    }
</style>
<body>
    <div class="form-control">
        <form class="form" action=""><br>
            <h3>Register Account</h3><br>
            <label for="username">Username:</label><br>
            <input type="text" placeholder="Enter your username"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" placeholder="Enter your email"><br><br>
            <label for="">Password</label><br>
            <input type="password" placeholder="Enter your password"><br><br>
            <label for="">Select Gender</label><br>
            <select name="" id="">
                <option value="">Male</option>
                <option value="">Female</option>
            </select>
            <button class="btn">Register</button>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index Example</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .parent {
            width: 500px;
            height: 500px;
            background-color: aqua;
            position: relative;
        }

        .child1 {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }

        .child2 {
            width: 100px;
            height: 100px;
            background-color: violet;
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }

        .child3 {
            width: 100px;
            height: 100px;
            background-color: yellow;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 15;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child3">3</div>
    </div>
</body>
</html>
